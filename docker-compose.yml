# GHCR 示例：将 IMAGE 替换为 ghcr.io/<你的 GitHub 用户名>/moments:latest
services:
  moments:
    image: ${IMAGE:-ghcr.io/kmoretti/moments:latest}
    container_name: moments
    restart: always
    environment:
      PORT: 3000
      JWT_KEY: $JWT_KEY
    ports:
      - 3000:3000
    volumes:
      - /var/moments:/app/data # 持久化数据到主机的 /var/moments 目录，可以按需修改
